# LLASER workshop: docker compose up -d, then open http://127.0.0.1:8080
name: llaser-workshop
services:
  backend:
    image: ghcr.io/pxl-research/llaser-workshop-demo/backend:${LLASER_TAG:-1}
    build: AI/AI
    env_file: .env
    volumes:
      - llaser-data:/app/data
      - llaser-model:/app/AI/API/models/malicious_prompt_detector:ro
    restart: unless-stopped
  frontend:
    image: ghcr.io/pxl-research/llaser-workshop-demo/frontend:${LLASER_TAG:-1}
    build:
      context: .
      dockerfile: AI/AI-web-app/Dockerfile.local
    ports:
      - "127.0.0.1:${LLASER_PORT:-8080}:8080"
      # The promptfoo UI goes through the frontend's nginx, which refuses other websites (see nginx.local.conf).
      - "127.0.0.1:${PROMPTFOO_PORT:-3002}:3002"
    depends_on: [backend]
    restart: unless-stopped
  # Installs the NLP model once: takes the file from ./models (USB stick) or downloads MODEL_URL,
  # checks the SHA-256, decrypts it with MODEL_PASSWORD from .env, unpacks it into llaser-model.
  model-init:
    image: ghcr.io/pxl-research/llaser-workshop-demo/frontend:${LLASER_TAG:-1}
    user: root
    environment:
      MODEL_URL: ${MODEL_URL:-https://github.com/pxl-research/llaser-workshop-demo/releases/download/model-1/model-1.tar.gz.enc}
      MODEL_SHA256: ${MODEL_SHA256:-92e17526bf04ff61bf3b913669e888f904060552837e0b119d860268635d5d70}
      MODEL_PASSWORD: ${MODEL_PASSWORD:-}
    volumes:
      - llaser-model:/model
      - ./models:/in:ro
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        set -o pipefail
        f=$${MODEL_URL##*/}
        if [ "$$(cat /model/.source 2>/dev/null)" = "$$f" ]; then echo "model: $$f already installed"; exit 0; fi
        [ -n "$$MODEL_PASSWORD" ] || { echo "model: set MODEL_PASSWORD in .env, then run docker compose up -d"; exit 1; }
        if [ -f "/in/$$f" ]; then cp "/in/$$f" /tmp/m; else echo "model: downloading $$f"; curl -fsSL -o /tmp/m "$$MODEL_URL"; fi
        echo "$$MODEL_SHA256  /tmp/m" | sha256sum -c -
        mkdir /tmp/x
        openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -pass env:MODEL_PASSWORD -in /tmp/m | tar -xz -C /tmp/x ||
          { echo "model: wrong MODEL_PASSWORD in .env? Fix it, then run docker compose up -d"; exit 1; }
        rm -rf /model/* /model/.source
        cp /tmp/x/* /model/
        echo "$$f" > /model/.source
        echo "model: $$f installed"
    restart: "no"
  # Standardized red-team runs; starts with the app. UI on http://127.0.0.1:3002 and on the Red team page.
  # Reaches the backend directly on the compose network; results stay in the promptfoo-data volume.
  promptfoo:
    image: ghcr.io/promptfoo/promptfoo:0.123.1@sha256:2dfddde000886e9a0bcce799478095a2e7d1e4438a6c6669ac04001e8ae29b85
    # No published port: the browser reaches the UI through the frontend's nginx on http://127.0.0.1:3002.
    environment:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      # The version is pinned on purpose: same attacks and grading for everyone. No "newer version" banner.
      PROMPTFOO_DISABLE_UPDATE: "1"
    volumes:
      - promptfoo-data:/home/promptfoo/.promptfoo
      - ./promptfoo:/home/promptfoo/config:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [backend]
    restart: unless-stopped
  # Starts the runs of the Automated red teaming page with promptfoo's command line, as ./005_promptfoo_run.sh
  # does, so promptfoo cloud grades them. No published port: only the backend calls it (http://promptfoo-runner:3100).
  promptfoo-runner:
    image: ghcr.io/promptfoo/promptfoo:0.123.1@sha256:2dfddde000886e9a0bcce799478095a2e7d1e4438a6c6669ac04001e8ae29b85
    command: ["node", "/home/promptfoo/config/runner.mjs"]
    environment:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
    volumes:
      # The same runs, settings and grading e-mail as the promptfoo service.
      - promptfoo-data:/home/promptfoo/.promptfoo
      - ./promptfoo:/home/promptfoo/config:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/runs/current').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
    depends_on: [promptfoo]
    restart: unless-stopped
volumes:
  llaser-data:
  llaser-model:
  promptfoo-data:
