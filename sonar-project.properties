sonar.organization=pxl-research-llaser
sonar.projectKey=pxl-research_llaser-workshop-demo

sonar.sources=.
sonar.tests=AI/AI/tests,AI/AI-web-app/src/tests
# Insecure on purpose: the attack sets (hidden-text prompts) and the plain-HTTP pretend attacker.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,AI/AI/tests/**,AI/AI-web-app/src/tests/**,promptfoo/attack-sets/**,scripts/leak-listener.py
# Tooling with its own checks (scripts/test-*.sh) and no coverage report.
sonar.coverage.exclusions=promptfoo/**,scripts/**

sonar.python.version=3.11
sonar.python.coverage.reportPaths=AI/AI/coverage.xml
sonar.javascript.lcov.reportPaths=AI/AI-web-app/coverage/lcov.info

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
