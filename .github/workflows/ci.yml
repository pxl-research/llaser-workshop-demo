name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/leakcheck.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: 'pip install --only-binary :all: --require-hashes -r AI/AI/requirements.txt && pip install --only-binary :all: pytest==9.1.1 pytest-cov==7.1.0'
      - run: python -m pytest tests -q --cov=. --cov-report=xml:coverage.xml
        working-directory: AI/AI
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AI/AI-web-app/package-lock.json
      - run: npm ci --ignore-scripts && npm run test:coverage && npm run build
        working-directory: AI/AI-web-app
      # Fork PRs get no secrets, so they skip the scan; every push scans, so images never skip the gate.
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  images:
    needs: test
    if: github.event_name == 'push'
    # ponytail: arm64 builds under QEMU (about 7 min for pip install); if too slow,
    # use a native ubuntu-24.04-arm matrix and merge with `docker buildx imagetools create`
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: backend, context: AI/AI, file: AI/AI/Dockerfile }
          - { image: frontend, context: ., file: AI/AI-web-app/Dockerfile.local }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
