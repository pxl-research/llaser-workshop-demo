# A cross-site page can send a multipart upload without a CORS preflight: only same-host origins
# (or none, as with curl) reach the API.
map $http_origin $llaser_foreign_origin {
  default 1;
  "" 0;
  ~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$ 0;
}

server {
  client_max_body_size 50M;
  listen 8080;
  server_name localhost;

  # Other Host names mean DNS rebinding: a website re-pointed at 127.0.0.1 must not reach the app.
  if ($host !~ ^(localhost|127\.0\.0\.1)$) {
    return 421;
  }

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    if ($llaser_foreign_origin) {
      return 403;
    }
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Upload answers only after indexing, which can outlast nginx's 60s default (same 600s as the vite dev proxy).
    proxy_read_timeout 600s;
    # Stream the SSE chat answer as it arrives.
    proxy_buffering off;
  }
}

# The promptfoo UI (http://127.0.0.1:3002), with the same checks as the app above.
# promptfoo itself has no login and allows every website (Access-Control-Allow-Origin: *),
# so its container publishes no port: the browser only reaches it through here.
server {
  listen 3002;
  server_name localhost;

  if ($host !~ ^(localhost|127\.0\.0\.1)$) {
    return 421;
  }

  # Docker's DNS, asked per request: the app keeps working while promptfoo is not running.
  resolver 127.0.0.11 valid=10s;
  set $promptfoo http://promptfoo:3000;

  location / {
    if ($llaser_foreign_origin) {
      return 403;
    }
    proxy_pass $promptfoo;
    proxy_set_header Host $host;
    # Other websites must not read promptfoo's answers either.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    # Live updates in the promptfoo UI use WebSockets.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 600s;
  }

  error_page 502 504 = @promptfoo_not_running;
  location @promptfoo_not_running {
    default_type text/plain;
    return 503 "promptfoo is not running. Start it with: docker compose up -d\n";
  }
}
