# A cross-site page can send a multipart upload without a CORS preflight: only same-host origins
# (or none, as with curl) reach the API.
map $http_origin $llaser_foreign_origin {
  default 1;
  "" 0;
  ~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$ 0;
}

server {
  client_max_body_size 50M;
  listen 8080;
  server_name localhost;

  # Other Host names mean DNS rebinding: a website re-pointed at 127.0.0.1 must not reach the app.
  if ($host !~ ^(localhost|127\.0\.0\.1)$) {
    return 421;
  }

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    if ($llaser_foreign_origin) {
      return 403;
    }
    proxy_pass http://backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Upload answers only after indexing, which can outlast nginx's 60s default (same 600s as the vite dev proxy).
    proxy_read_timeout 600s;
    # Stream the SSE chat answer as it arrives.
    proxy_buffering off;
  }
}
